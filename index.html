
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSH.Game | NSH.made</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
 --green:#167b55;
 --dark:#0e5b3e;
 --mint:#e8fff5;
 --gold:#d8ad45;
 --bg:#f7fcf9;
 --text:#18352a;
 --border:#dceee5;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Tahoma,Arial,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
 height:68px;background:white;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 18px;position:sticky;top:0;z-index:20;
}
.brand{font-size:23px;font-weight:bold;color:var(--dark)}
.brand span{color:var(--gold)}
button{
 border:0;border-radius:11px;padding:10px 15px;
}
.primary{background:var(--green);color:white}
.secondary{background:var(--mint);color:var(--dark)}
.danger{background:#ffecec;color:#b83232}
.menu{
 background:var(--mint);color:var(--dark);
 font-size:22px;
}
.layout{display:flex;min-height:calc(100vh - 68px)}
.sidebar{
 width:255px;background:white;border-left:1px solid var(--border);
 padding:20px;position:fixed;right:0;top:68px;bottom:0;
 z-index:30;transform:translateX(105%);
 transition:.25s;overflow:auto;
}
.sidebar.open{transform:translateX(0)}
.sidebar button{
 display:block;width:100%;text-align:right;
 margin:5px 0;background:transparent;color:var(--text);
}
.sidebar button:hover{background:var(--mint)}
.shade{
 display:none;position:fixed;inset:68px 0 0;
 background:#0008;z-index:25;
}
.shade.show{display:block}
main{width:100%;padding:25px;max-width:1200px;margin:auto}
.hero{
 background:linear-gradient(120deg,#dfffee,#fff7df);
 border:1px solid var(--border);border-radius:22px;
 padding:30px;margin-bottom:25px;
}
.hero h1{font-size:32px}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:16px;
}
.card,.panel{
 background:white;border:1px solid var(--border);
 border-radius:17px;padding:16px;
}
.thumb{
 height:130px;background:var(--mint);
 border-radius:12px;display:flex;align-items:center;
 justify-content:center;font-size:45px;overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.card h3{margin-bottom:5px}
.card p{color:#688176;font-size:13px}
.page{display:none}
.page.active{display:block}
input,textarea,select{
 width:100%;padding:11px;border:1px solid var(--border);
 border-radius:10px;margin:5px 0 13px;background:white;
}
textarea{min-height:90px}
label{font-size:13px;color:#688176}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.row{display:flex;gap:9px;flex-wrap:wrap}
.notice{padding:12px;background:var(--mint);border-radius:10px;margin:12px 0}
.modal{
 display:none;position:fixed;inset:0;background:#000b;
 z-index:60;align-items:center;justify-content:center;padding:12px;
}
.modal.show{display:flex}
.modal-box{
 width:min(100%,1000px);height:min(90vh,700px);
 background:white;border-radius:15px;overflow:hidden;
 display:flex;flex-direction:column;
}
.modal-head{padding:12px;display:flex;justify-content:space-between}
.modal-body{flex:1;min-height:0}
.modal-body iframe{width:100%;height:100%;border:0}
.toast{
 position:fixed;bottom:15px;left:15px;z-index:100;
 background:var(--dark);color:white;padding:13px 18px;
 border-radius:12px;display:none;max-width:90%;
}
footer{text-align:center;color:#688176;padding:30px}
@media(min-width:900px){
 .sidebar{transform:none;position:sticky;height:calc(100vh - 68px);top:68px;flex-shrink:0}
 .menu{display:none}
 .shade{display:none!important}
}
@media(max-width:600px){
 main{padding:15px}
 .hero h1{font-size:24px}
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
}
</style>
</head>
<body>

<header>
 <button class="menu" id="menuToggle">☰</button>
 <div class="brand">NSH<span>.</span>Game</div>
 <button class="secondary" data-page="account">حساب کاربری</button>
</header>

<div class="shade" id="shade"></div>

<div class="layout">
<aside class="sidebar" id="sidebar">
 <div class="brand">NSH<span>.</span>made</div>
 <hr>
 <button data-page="home">🏠 خانه</button>
 <button data-page="games">🎮 همه بازی‌ها</button>
 <button data-page="categories">🗂 دسته‌بندی‌ها</button>
 <button data-page="account">👤 حساب کاربری</button>
 <button data-page="admin">⚙️ مدیریت سایت</button>
 <button data-page="about">ℹ️ درباره ما</button>
</aside>

<main>

<section class="page active" id="home">
 <div class="hero">
  <h1>به NSH.Game خوش آمدی 🎮</h1>
  <p>بازی‌ها و ابزارهای دیجیتال در یک مکان.</p>
  <button class="primary" data-page="games">مشاهده بازی‌ها</button>
 </div>
 <h2>بازی‌های منتخب</h2>
 <div class="grid" id="featured"></div>
</section>

<section class="page" id="games">
 <h2>همه بازی‌ها</h2>
 <input id="search" placeholder="جست‌وجوی بازی...">
 <div class="grid" id="gameList"></div>
</section>

<section class="page" id="categories">
 <h2>دسته‌بندی‌ها</h2>
 <div class="grid" id="categoryList"></div>
</section>

<section class="page" id="account">
 <div class="panel" id="accountPanel"></div>
</section>

<section class="page" id="admin">
 <h2>پنل مدیریت</h2>
 <div id="adminPanel"></div>
</section>

<section class="page" id="about">
 <div class="panel">
  <h2>درباره NSH.Game</h2>
  <p>ساخته‌شده با NSH.made</p>
 </div>
</section>

<footer>© NSH.Game | NSH.made</footer>
</main>
</div>

<div class="modal" id="gameModal">
 <div class="modal-box">
  <div class="modal-head">
   <b id="modalTitle">بازی</b>
   <button id="closeGame">✕</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
 </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* تنظیمات Supabase */
const SUPABASE_URL="https://knuludqjykyijqfaolwu.supabase.co";
const SUPABASE_KEY="sb_publishable_55TKXT3Eu20nq6SUzaDfOg_0R93DhLV";
const BUCKET="nsh-game-files";

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

let db=null;
let user=null;
let profile=null;
let games=[];
let categories=[];
let selectedCategory=null;

function notify(message){
 const t=$("#toast");
 t.textContent=message;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.style.display="none",3500);
}

function safe(value=""){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function closeMenu(){
 $("#sidebar").classList.remove("open");
 $("#shade").classList.remove("show");
 $("#menuToggle").setAttribute("aria-expanded","false");
}

function showPage(name){
 $$(".page").forEach(p=>p.classList.remove("active"));
 const page=$("#"+name);
 if(page)page.classList.add("active");
 closeMenu();
 if(name==="admin")renderAdmin();
 if(name==="account")renderAccount();
 if(name==="games")renderGames();
 if(name==="categories")renderCategories();
 window.scrollTo(0,0);
}

$("#menuToggle").addEventListener("click",()=>{
 const open=!$("#sidebar").classList.contains("open");
 $("#sidebar").classList.toggle("open",open);
 $("#shade").classList.toggle("show",open);
 $("#menuToggle").setAttribute("aria-expanded",String(open));
});
$("#shade").addEventListener("click",closeMenu);
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  closeMenu();
  closeGame();
 }
});

function categoryName(id){
 return categories.find(c=>c.id===id)?.name||"بدون دسته‌بندی";
}

function card(game){
 return `
 <article class="card">
  <div class="thumb">
   ${game.thumbnail_url?`<img src="${safe(game.thumbnail_url)}" alt="">`:"🎮"}
  </div>
  <h3>${safe(game.title)}</h3>
  <p>${safe(game.description||"بدون توضیحات")}</p>
  <small>${safe(categoryName(game.category_id))}</small>
  <div class="row" style="margin-top:12px">
   <button class="primary" data-action="play" data-id="${safe(game.id)}">اجرای بازی</button>
   ${isAdmin()?`<button class="secondary" data-action="edit" data-id="${safe(game.id)}">ویرایش</button>`:""}
  </div>
 </article>`;
}

function renderGames(){
 const q=($("#search").value||"").trim().toLowerCase();
 const list=games.filter(g=>
  (!selectedCategory||g.category_id===selectedCategory)&&
  `${g.title} ${g.description||""}`.toLowerCase().includes(q)
 );
 $("#gameList").innerHTML=list.map(card).join("")||"<p>بازی‌ای پیدا نشد.</p>";
}

function renderHome(){
 const featured=games.filter(g=>g.featured);
 $("#featured").innerHTML=(featured.length?featured:games.slice(0,4))
  .map(card).join("")||"<p>هنوز بازی‌ای منتشر نشده است.</p>";
}

function renderCategories(){
 $("#categoryList").innerHTML=categories.map(c=>`
  <button class="card" data-action="category" data-id="${safe(c.id)}">
   🗂️ ${safe(c.name)}
  </button>
 `).join("")||"<p>دسته‌بندی موجود نیست.</p>";
}

async function loadData(){
 const [c,g]=await Promise.all([
  db.from("categories").select("*").order("name"),
  db.from("games").select("*").eq("status","published")
   .order("created_at",{ascending:false})
 ]);
 if(c.error)throw c.error;
 if(g.error)throw g.error;
 categories=c.data||[];
 games=g.data||[];
 renderHome();
 renderGames();
 renderCategories();
}

async function refreshUser(){
 const {data,error}=await db.auth.getUser();
 if(error)throw error;
 user=data.user;
 profile=null;
 if(user){
  const result=await db.from("profiles").select("*")
   .eq("id",user.id).maybeSingle();
  if(!result.error)profile=result.data;
 }
}

function isAdmin(){
 return profile?.role==="admin";
}

function renderAccount(){
 if(!user){
  $("#accountPanel").innerHTML=`
   <h2>ورود / ثبت‌نام</h2>
   <form id="authForm">
    <label>ایمیل</label>
    <input name="email" type="email" required>
    <label>رمز عبور</label>
    <input name="password" type="password" minlength="6" required>
    <div class="row">
     <button class="primary" type="submit">ورود</button>
     <button class="secondary" type="button" id="signup">ثبت‌نام</button>
    </div>
   </form>`;
 }else{
  $("#accountPanel").innerHTML=`
   <h2>حساب کاربری</h2>
   <p>${safe(user.email)}</p>
   <p>${isAdmin()?"مدیر":"کاربر عادی"}</p>
   <button class="danger" data-action="logout">خروج</button>`;
 }
}

async function uploadFile(file,folder){
 if(!file)return null;
 if(file.size>50*1024*1024)throw Error("حداکثر حجم فایل ۵۰ مگابایت است.");
 const name=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const path=folder+"/"+Date.now()+"-"+name;
 const {error}=await db.storage.from(BUCKET).upload(path,file);
 if(error)throw error;
 return path;
}

async function temporaryUrl(path){
 if(!path)return null;
 const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,3600);
 if(error)throw error;
 return data.signedUrl;
}

function renderAdmin(){
 if(!user||!isAdmin()){
  $("#adminPanel").innerHTML='<div class="panel">برای مدیریت باید با حساب مدیر وارد شوی.</div>';
  return;
 }

 $("#adminPanel").innerHTML=`
 <div class="panel">
  <h3>افزودن / ویرایش بازی</h3>
  <form id="gameForm">
   <input type="hidden" name="id">
   <div class="form-grid">
    <div><label>عنوان بازی</label><input name="title" required></div>
    <div><label>دسته‌بندی</label>
     <select name="category_id">
      <option value="">بدون دسته‌بندی</option>
      ${categories.map(c=>`<option value="${safe(c.id)}">${safe(c.name)}</option>`).join("")}
     </select>
    </div>
    <div class="full"><label>توضیحات</label><textarea name="description"></textarea></div>
    <div><label>نوع بازی</label>
     <select name="game_type">
      <option value="browser">HTML</option>
      <option value="external">لینک خارجی</option>
      <option value="download">دانلود</option>
     </select>
    </div>
    <div><label>وضعیت</label>
     <select name="status">
      <option value="draft">پیش‌نویس</option>
      <option value="published">منتشرشده</option>
      <option value="archived">بایگانی</option>
     </select>
    </div>
    <div class="full"><label>آدرس بازی</label><input name="game_url" type="url"></div>
    <div><label>تصویر</label><input name="thumbnail" type="file" accept="image/*"></div>
    <div><label>فایل HTML یا ZIP</label><input name="gamefile" type="file" accept=".html,.htm,.zip"></div>
    <div><label><input type="checkbox" name="featured" style="width:auto"> منتخب</label></div>
   </div>
   <button class="primary" type="submit">ذخیره بازی</button>
   <button class="secondary" type="reset">پاک کردن فرم</button>
  </form>
 </div>
 <div class="panel">
  <h3>بازی‌های ثبت‌شده</h3>
  <div id="adminGames"></div>
 </div>`;
 renderAdminGames();
}

function renderAdminGames(){
 const el=$("#adminGames");
 if(!el)return;
 el.innerHTML=games.map(g=>`
  <div class="row" style="justify-content:space-between;border-bottom:1px solid #ddd;padding:10px">
   <span>${safe(g.title)} (${safe(g.status)})</span>
   <div class="row">
    <button class="secondary" data-action="edit" data-id="${safe(g.id)}">ویرایش</button>
    <button class="danger" data-action="delete" data-id="${safe(g.id)}">حذف</button>
   </div>
  </div>
 `).join("")||"<p>بازی ثبت نشده است.</p>";
}

async function saveGame(form){
 if(!isAdmin())throw Error("دسترسی مدیر لازم است.");
 const fd=new FormData(form);
 const id=fd.get("id");
 const payload={
  title:String(fd.get("title")||"").trim(),
  description:String(fd.get("description")||"").trim(),
  category_id:fd.get("category_id")||null,
  game_type:fd.get("game_type"),
  status:fd.get("status"),
  game_url:String(fd.get("game_url")||"").trim()||null,
  featured:fd.get("featured")==="on",
  updated_at:new Date().toISOString()
 };
 if(!payload.title)throw Error("عنوان بازی الزامی است.");

 const thumb=fd.get("thumbnail");
 const gameFile=fd.get("gamefile");

 if(thumb?.size){
  const path=await uploadFile(thumb,"thumbnails");
  payload.thumbnail_url=await temporaryUrl(path);
 }
 if(gameFile?.size){
  const path=await uploadFile(gameFile,"games");
  payload.game_url=await temporaryUrl(path);
  if(/\.(html?|zip)$/i.test(gameFile.name)){
   if(/\.zip$/i.test(gameFile.name))payload.game_type="download";
   else payload.game_type="browser";
  }
 }

 let result;
 if(id){
  result=await db.from("games").update(payload).eq("id",id);
 }else{
  payload.created_at=new Date().toISOString();
  result=await db.from("games").insert(payload);
 }
 if(result.error)throw result.error;

 form.reset();
 await loadData();
 renderAdmin();
 notify("بازی ذخیره شد.");
}

async function editGame(id){
 const game=games.find(g=>String(g.id)===String(id));
 if(!game)throw Error("بازی پیدا نشد.");
 const form=$("#gameForm");
 if(!form)throw Error("فرم مدیریت پیدا نشد.");

 const set=(name,value)=>{
  const field=form.elements.namedItem(name);
  if(field)field.value=value??"";
 };
 set("id",game.id);
 set("title",game.title);
 set("description",game.description);
 set("category_id",game.category_id);
 set("game_type",game.game_type);
 set("status",game.status);
 set("game_url",game.game_url);
 const featured=form.elements.namedItem("featured");
 if(featured)featured.checked=!!game.featured;
 form.scrollIntoView({behavior:"smooth"});
}

async function deleteGame(id){
 if(!isAdmin())throw Error("دسترسی مدیر لازم است.");
 if(!confirm("این بازی حذف شود؟"))return;
 const {error}=await db.from("games").delete().eq("id",id);
 if(error)throw error;
 await loadData();
 renderAdmin();
 notify("بازی حذف شد.");
}

async function playGame(id){
 const game=games.find(g=>String(g.id)===String(id));
 if(!game)throw Error("بازی پیدا نشد.");
 let url=game.game_url;
 if(url&&!/^https?:\/\//i.test(url))url=await temporaryUrl(url);

 $("#modalTitle").textContent=game.title;
 $("#gameModal").classList.add("show");

 if(!url){
  $("#modalBody").innerHTML="<p style='padding:25px'>آدرس بازی ثبت نشده است.</p>";
 }else if(game.game_type==="download"){
  $("#modalBody").innerHTML=`<div style="padding:30px"><a class="primary" href="${safe(url)}" target="_blank" rel="noopener">دانلود بازی</a></div>`;
 }else if(game.game_type==="external"){
  $("#modalBody").innerHTML=`<div style="padding:30px"><a class="primary" href="${safe(url)}" target="_blank" rel="noopener">باز کردن بازی</a></div>`;
 }else{
  $("#modalBody").innerHTML=`<iframe src="${safe(url)}" title="${safe(game.title)}" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups"></iframe>`;
 }
}

function closeGame(){
 $("#gameModal").classList.remove("show");
 $("#modalBody").innerHTML="";
}
$("#closeGame").addEventListener("click",closeGame);
$("#gameModal").addEventListener("click",e=>{
 if(e.target.id==="gameModal")closeGame();
});

document.addEventListener("click",async e=>{
 const page=e.target.closest("[data-page]");
 if(page){showPage(page.dataset.page);return;}

 const button=e.target.closest("[data-action]");
 if(!button)return;

 try{
  const action=button.dataset.action;
  const id=button.dataset.id;

  if(action==="play")await playGame(id);
  if(action==="edit")await editGame(id);
  if(action==="delete")await deleteGame(id);
  if(action==="logout"){
   const {error}=await db.auth.signOut();
   if(error)throw error;
   await refreshUser();
   renderAccount();
   renderAdmin();
   notify("خارج شدی.");
  }
  if(action==="category"){
   selectedCategory=id;
   showPage("games");
   renderGames();
  }
 }catch(error){
  console.error(error);
  notify("خطا: "+error.message);
 }
});

document.addEventListener("submit",async e=>{
 if(e.target.id==="gameForm"){
  e.preventDefault();
  try{await saveGame(e.target);}
  catch(error){console.error(error);notify(error.message);}
 }
 if(e.target.id==="authForm"){
  e.preventDefault();
  try{
   const fd=new FormData(e.target);
   const {error}=await db.auth.signInWithPassword({
    email:fd.get("email"),
    password:fd.get("password")
   });
   if(error)throw error;
   await refreshUser();
   renderAccount();
   renderAdmin();
   notify("ورود موفق بود.");
  }catch(error){notify(error.message);}
 }
});

document.addEventListener("click",async e=>{
 if(e.target.id==="signup"){
  const form=$("#authForm");
  if(!form.reportValidity())return;
  try{
   const fd=new FormData(form);
   const {error}=await db.auth.signUp({
    email:fd.get("email"),
    password:fd.get("password")
   });
   if(error)throw error;
   notify("ثبت‌نام انجام شد؛ ایمیل خود را بررسی کن.");
  }catch(error){notify(error.message);}
 }
});

$("#search").addEventListener("input",renderGames);

async function refreshUser(){
 const {data,error}=await db.auth.getUser();
 if(error)throw error;
 user=data.user;
 profile=null;
 if(user){
  const {data,error}=await db.from("profiles")
   .select("*").eq("id",user.id).maybeSingle();
  if(!error)profile=data;
 }
}

async function startApp(){
 if(!window.supabase?.createClient){
  notify("اتصال Supabase بارگذاری نشد.");
  return;
 }
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 db.auth.onAuthStateChange(()=>{
  setTimeout(async()=>{
   try{
    await refreshUser();
    renderAccount();
    renderAdmin();
    await loadData();
   }catch(error){console.error(error);}
  },0);
 });
 try{
  await refreshUser();
  await loadData();
 }catch(error){
  console.error(error);
  notify("خطا در دریافت اطلاعات: "+error.message);
 }
 renderAccount();
 renderAdmin();
}

startApp();
</script>
</body>
</html>
