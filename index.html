<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSH.Game</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--mint:#2fd6a0;--md:#0fa57a;--mint2:#effcf7;--gold:#e8b21f;--tx:#173029;--mu:#6f8780;--bd:#dcefe8;--sh:0 8px 30px rgba(20,120,90,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(600px 420px at 92% -5%,#c9f6e6,transparent 70%),radial-gradient(520px 400px at 0 35%,#fff0c4,transparent 70%),#fbfffd;background-attachment:fixed}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
#menuBtn{width:44px;height:44px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--mint),var(--md));color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 16px rgba(47,214,160,.4);transition:.2s}#menuBtn:hover{transform:scale(1.08)}
.logo,footer b{font-weight:700;font-size:24px;color:var(--tx);text-decoration:none}.logo span,footer b span{background:linear-gradient(135deg,var(--gold),#f5d060);-webkit-background-clip:text;background-clip:text;color:transparent}
#q{flex:1;max-width:340px;margin-inline-start:auto;padding:11px 18px;border:1px solid var(--bd);border-radius:30px;font:inherit;background:#fff;outline:0;transition:.2s}#q:focus{border-color:var(--mint);box-shadow:0 0 0 4px rgba(47,214,160,.18)}
#overlay{position:fixed;inset:0;background:rgba(15,40,34,.35);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:30}
#side{position:fixed;top:0;bottom:0;right:0;width:270px;max-width:82vw;background:#fff;z-index:40;transform:translateX(105%);transition:.35s cubic-bezier(.2,.8,.2,1);padding:80px 16px 16px;box-shadow:-10px 0 40px rgba(0,0,0,.12);border-radius:28px 0 0 28px}
#side::before{content:"NSH.Game";position:absolute;top:24px;right:24px;font-weight:700;font-size:22px;color:var(--md)}
body.open #side{transform:none}body.open #overlay{opacity:1;pointer-events:auto}
#side a{display:block;padding:13px 16px;margin-bottom:6px;border-radius:14px;color:var(--tx);text-decoration:none;transition:.2s}
#side a:hover{background:var(--mint2);transform:translateX(-4px)}#side a.on{background:linear-gradient(135deg,var(--mint),var(--md));color:#fff;font-weight:700}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:22px 16px}
h2{font-size:20px;margin:34px 0 14px;display:flex;align-items:center;gap:10px}h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--bd),transparent)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:44px 28px;color:#fff;background:linear-gradient(135deg,#2fd6a0,#12a77c 60%,#0e8f8a);box-shadow:0 20px 50px rgba(18,167,124,.28)}
.hero>*{position:relative}.hero i{position:absolute;border-radius:50%;pointer-events:none}
.b1{width:260px;height:260px;background:rgba(255,255,255,.15);top:-90px;left:-60px}.b2{width:180px;height:180px;background:rgba(255,215,90,.38);bottom:-70px;right:10%}
.badge{display:inline-block;background:rgba(255,255,255,.22);padding:5px 14px;border-radius:20px;font-size:13px}
.hero h1{font-size:clamp(26px,5.5vw,44px);margin:14px 0 8px;line-height:1.45}.hero h1 em{font-style:normal;color:#ffe27a}.hero p{margin:0 0 20px;opacity:.95}
.hs{display:flex;gap:10px;flex-wrap:wrap}.hs input{flex:1;min-width:200px;padding:14px 20px;border-radius:30px;border:0;font:inherit;outline:0;color:var(--tx)}
.stats{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}.stats div{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 22px;font-size:13px;text-align:center}.stats b{display:block;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);border:1px solid var(--bd);transition:.3s}
.card:hover{transform:translateY(-8px);box-shadow:0 18px 40px rgba(20,150,110,.2)}
.card .im{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#d8f8ec,#fff3cf) center/cover;display:grid;place-items:center;font-size:52px}
.card .im::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.22))}.card .im .tag{position:absolute;top:10px;right:10px;z-index:1}
.card .bd{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.card h3{margin:0;font-size:17px}
.card p{margin:0;font-size:13px;color:var(--mu);flex:1;line-height:1.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:11px;font-weight:700;background:var(--mint2);color:var(--md);border-radius:10px;padding:3px 10px;align-self:flex-start}.tag.gold{background:#fff3c8;color:#9a7300}
.btn{border:0;border-radius:14px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--mint),var(--md));box-shadow:0 6px 14px rgba(47,214,160,.35);transition:.2s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px)}.btn.gold{background:linear-gradient(135deg,#f5c542,#e0a100);box-shadow:0 6px 14px rgba(232,178,31,.35)}.btn.red{background:linear-gradient(135deg,#ff7a7a,#e04a4a);box-shadow:none}.btn.sm{padding:6px 12px;font-size:13px;box-shadow:none}.btn:disabled{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.chip{padding:8px 18px;border-radius:30px;border:1px solid var(--bd);background:#fff;cursor:pointer;font:inherit;transition:.2s}.chip:hover{border-color:var(--mint)}.chip.on{background:linear-gradient(135deg,var(--mint),var(--md));color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(47,214,160,.35)}
.box{background:#fff;border:1px solid var(--bd);border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:var(--sh);line-height:2}
form.f{display:grid;gap:12px}form.f input,form.f select,form.f textarea{padding:12px 14px;border:1px solid var(--bd);border-radius:14px;font:inherit;width:100%;background:#fdfffe;outline:0}form.f input:focus,form.f select:focus,form.f textarea:focus{border-color:var(--mint);box-shadow:0 0 0 4px rgba(47,214,160,.15)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--bd);flex-wrap:wrap}.muted{color:var(--mu)}
.empty{text-align:center;padding:40px 10px;font-size:40px;color:var(--mu);background:#fff;border:2px dashed var(--bd);border-radius:22px}.empty small{display:block;font-size:14px;margin-top:6px}
footer{text-align:center;padding:26px 16px;background:#fff;border-top:3px solid transparent;border-image:linear-gradient(90deg,var(--mint),var(--gold)) 1;color:var(--mu);margin-top:30px}footer p{margin:4px 0}
#modal{position:fixed;inset:0;background:rgba(10,30,25,.7);backdrop-filter:blur(4px);z-index:60;display:grid;place-items:center}#modal[hidden]{display:none}
.mbox{position:relative;width:96vw;height:90vh;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}.mbox iframe{width:100%;height:100%;border:0}
#mclose{position:absolute;top:10px;left:10px;z-index:2;border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;background:linear-gradient(135deg,#f5c542,#e0a100);color:#fff;font-size:16px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:#fff;color:var(--tx);padding:12px 22px;border-radius:16px;border-inline-start:5px solid var(--mint);box-shadow:0 12px 34px rgba(0,0,0,.18);transition:.35s;z-index:80;opacity:0}#toast.show{transform:translate(-50%,0);opacity:1}#toast.err{border-color:#e04a4a}
#start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;cursor:pointer;background:radial-gradient(500px 400px at 85% 10%,#bdf5df,transparent 70%),radial-gradient(500px 400px at 10% 90%,#ffeaa8,transparent 70%),#fff;transition:opacity .6s,visibility .6s}
#start.hide{opacity:0;visibility:hidden}
#start .pad{font-size:64px;width:120px;height:120px;border-radius:34px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--md));box-shadow:0 20px 50px rgba(47,214,160,.45);animation:fl 2.6s ease-in-out infinite}
#start .big{font-size:clamp(46px,13vw,90px);font-weight:700;margin-top:10px}#start .big span{color:var(--gold)}#start p{color:var(--mu);margin:0}
#start .bar{width:160px;height:6px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:18px}#start .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--gold));animation:ld 2.2s linear forwards}
@keyframes fl{50%{transform:translateY(-12px) rotate(-4deg)}}@keyframes ld{to{width:100%}}
</style>
</head>
<body>
<div id="start"><div class="pad">🎮</div><div class="big">NSH<span>.Game</span></div><p>دنیای بازی‌های NSH.made</p><div class="bar"><i></i></div></div>
<header class="top">
  <button id="menuBtn" aria-label="منو" aria-expanded="false">☰</button>
  <a href="#home" class="logo">NSH<span>.Game</span></a>
  <input id="q" type="search" placeholder="جست‌وجوی بازی…">
</header>
<div id="overlay"></div>
<aside id="side" aria-hidden="true">
  <nav>
    <a href="#home">🏠 خانه</a>
    <a href="#games">🎮 همه بازی‌ها</a>
    <a href="#cats">🗂 دسته‌بندی‌ها</a>
    <a href="#account">👤 حساب کاربری</a>
    <a href="#admin" id="adminLink" hidden>⚙️ پنل مدیریت</a>
    <a href="#about">ℹ️ درباره ما</a>
  </nav>
</aside>
<main id="app"><p class="muted">در حال بارگذاری…</p></main>
<footer><b>NSH<span>.Game</span></b><p>ساخته‌شده با ❤️ توسط NSH.made</p><small>© تمام حقوق محفوظ است</small></footer>
<div id="modal" hidden><div class="mbox"><button id="mclose">✕</button><iframe id="frame" sandbox="allow-scripts allow-pointer-lock"></iframe></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
const SB_URL = 'https://knuludqjykyijqfaolwu.supabase.co';
const SB_KEY = 'sb_publishable_55TKXT3Eu20nq6SUzaDfOg_0R93DhLV';
const B = 'nsh-game-files', MAX = 50 * 1024 * 1024;
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TYPES = { html: 'اجرا در سایت', external: 'لینک خارجی', download: 'دانلود' };
let user = null, isAdmin = false, cats = [], games = [], imgs = {}, catF = '', term = '';

function toast(m, err) {
  const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3200);
}
const menu = o => {
  document.body.classList.toggle('open', o);
  $('#menuBtn').setAttribute('aria-expanded', o); $('#side').setAttribute('aria-hidden', !o);
};
$('#menuBtn').addEventListener('click', () => menu(!document.body.classList.contains('open')));
$('#overlay').addEventListener('click', () => menu(false));
$('#side').addEventListener('click', e => { if (e.target.closest('a')) menu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { menu(false); closeModal(); } });
$('#mclose').addEventListener('click', closeModal);
function closeModal() { $('#modal').hidden = true; $('#frame').srcdoc = ''; }
$('#q').addEventListener('input', e => { term = e.target.value.trim().toLowerCase(); if (location.hash !== '#games') location.hash = '#games'; else render(); });

async function load() {
  const [c, g] = await Promise.all([
    sb.from('categories').select('*').order('name'),
    sb.from('games').select('*').order('created_at', { ascending: false })
  ]);
  if (c.error) throw c.error; if (g.error) throw g.error;
  cats = c.data; games = g.data; imgs = {};
  const ps = games.map(x => x.image_path).filter(Boolean);
  if (ps.length) {
    const { data } = await sb.storage.from(B).createSignedUrls(ps, 3600);
    (data || []).forEach(d => { if (d.signedUrl) imgs[d.path] = d.signedUrl; });
  }
}
async function loadUser() {
  const { data } = await sb.auth.getSession(); user = data.session?.user || null; isAdmin = false;
  if (user) { const { data: p } = await sb.from('profiles').select('role').eq('id', user.id).maybeSingle(); isAdmin = p?.role === 'admin'; }
  $('#adminLink').hidden = !isAdmin;
}
async function refresh() { try { await load(); } catch (e) { toast('خطا در دریافت اطلاعات: ' + e.message, 1); } render(); }

const catName = id => cats.find(c => c.id === id)?.name || 'بدون دسته';
function card(g) {
  const im = imgs[g.image_path];
  const label = g.type === 'html' ? '▶ اجرا' : g.type === 'download' ? '⬇ دانلود' : '↗ باز کردن';
  return `<div class="card"><div class="im" ${im ? `style="background-image:url('${esc(im)}')"` : ''}>${im ? '' : '🎮'}<span class="tag gold">${TYPES[g.type]}</span></div><div class="bd"><span class="tag">${esc(catName(g.category_id))}</span><h3>${esc(g.title)}</h3><p>${esc(g.description)}</p><button class="btn" data-act="play" data-id="${g.id}">${label}</button></div></div>`;
}
const grid = l => l.length ? `<div class="grid">${l.map(card).join('')}</div>` : '<div class="empty">🎮<small>هنوز بازی‌ای اینجا نیست</small></div>';
const pub = () => games.filter(g => g.status === 'published');

const views = {
  home() {
    return `<section class="hero"><i class="b1"></i><i class="b2"></i><span class="badge">✨ NSH.made</span>
    <h1>بازی‌های باحال، <em>یک‌جا</em> و در دسترس</h1><p>بازی‌ها را آنلاین اجرا کن، دانلود کن و لذت ببر.</p>
    <div class="hs"><input data-search placeholder="دنبال چه بازی‌ای هستی؟"><a class="btn gold" href="#games">🎮 همه بازی‌ها</a></div>
    <div class="stats"><div><b>${pub().length}</b>بازی</div><div><b>${cats.length}</b>دسته‌بندی</div><div><b>${pub().filter(g => g.featured).length}</b>منتخب</div></div></section>
    <h2>⭐ بازی‌های منتخب</h2>${grid(pub().filter(g => g.featured))}
    <h2>🗂 دسته‌بندی‌ها</h2>${chips()}
    <h2>🧰 ابزارها و برنامه‌ها</h2>${grid(pub().filter(g => g.type === 'download'))}
    <h2>ℹ️ درباره ما</h2><div class="box">NSH.made سازنده بازی‌ها و ابزارهای وب فارسی است. اینجا بازی‌ها را آنلاین اجرا یا دانلود کنید.</div>`;
  },
  games() {
    const l = pub().filter(g => (!catF || g.category_id === catF) && (!term || (g.title + ' ' + (g.description || '')).toLowerCase().includes(term)));
    return `<h2>همه بازی‌ها</h2>${chips()}${grid(l)}`;
  },
  cats() { return `<h2>دسته‌بندی‌ها</h2>${chips()}${grid(pub().filter(g => !catF || g.category_id === catF))}`; },
  about() { return `<h2>درباره ما</h2><div class="box">NSH.Game پورتال بازی‌های NSH.made است؛ بازی‌ها را آنلاین اجرا یا دانلود کنید.</div>`; },
  account() {
    if (user) return `<h2>حساب کاربری</h2><div class="box"><p>ایمیل: ${esc(user.email)}</p><p>نقش: ${isAdmin ? 'مدیر' : 'کاربر عادی'}</p><button class="btn red" data-act="logout">خروج</button></div>`;
    return `<h2>ورود / ثبت‌نام</h2><form class="f box" id="authForm"><input name="email" type="email" placeholder="ایمیل" required>
    <input name="password" type="password" minlength="6" placeholder="رمز عبور (حداقل ۶ کاراکتر)" required>
    <div class="row"><button class="btn" data-act="login" type="submit">ورود</button><button class="btn gold" type="button" data-act="register">ثبت‌نام</button></div></form>`;
  },
  admin() {
    if (!isAdmin) return '<div class="box">دسترسی فقط برای مدیر است.</div>';
    return `<h2>پنل مدیریت</h2>
    <div class="box"><h3>دسته‌بندی</h3><form class="f" id="catForm"><input name="name" placeholder="نام دسته جدید" required><button class="btn">افزودن</button></form>
    ${cats.map(c => `<div class="row"><span>${esc(c.name)}</span><button class="btn red sm" data-act="delcat" data-id="${c.id}">حذف</button></div>`).join('')}</div>
    <div class="box"><h3 id="gt">افزودن بازی</h3><form class="f" id="gameForm"><input type="hidden" name="id">
    <input name="title" placeholder="نام بازی" required><textarea name="description" rows="3" placeholder="توضیحات"></textarea>
    <select name="category_id"><option value="">بدون دسته</option>${cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
    <select name="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
    <input name="url" type="url" placeholder="لینک (برای بازی خارجی یا دانلود لینکی)">
    <label>تصویر بازی <input name="image" type="file" accept="image/*"></label>
    <label>فایل HTML یا ZIP (حداکثر ۵۰MB) <input name="file" type="file" accept=".html,.htm,.zip"></label>
    <select name="status"><option value="published">منتشر شده</option><option value="draft">پیش‌نویس</option></select>
    <label><input name="featured" type="checkbox" style="width:auto"> بازی منتخب</label>
    <div class="row"><button class="btn" id="saveBtn">ذخیره</button><button class="btn gold" type="button" data-act="reset">جدید</button></div></form></div>
    <div class="box"><h3>همه بازی‌ها</h3>${games.map(g => `<div class="row"><span>${esc(g.title)} <span class="tag">${g.status === 'published' ? 'منتشر' : 'پیش‌نویس'}</span>${g.featured ? '⭐' : ''}</span>
    <span><button class="btn sm" data-act="edit" data-id="${g.id}">ویرایش</button> <button class="btn red sm" data-act="delgame" data-id="${g.id}">حذف</button></span></div>`).join('') || '<p class="muted">بازی‌ای نیست.</p>'}</div>`;
  }
};
function chips() {
  return `<div class="chips"><button class="chip ${catF ? '' : 'on'}" data-act="cat" data-id="">همه</button>${cats.map(c => `<button class="chip ${catF === c.id ? 'on' : ''}" data-act="cat" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div>`;
}
function render() {
  const v = (location.hash.slice(1) || 'home'); const name = views[v] ? v : 'home';
  app.innerHTML = views[name]();
  document.querySelectorAll('#side a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + name));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

async function play(id) {
  const g = games.find(x => x.id === id); if (!g) return;
  if (g.type === 'external') { if (!g.url) throw new Error('لینک ثبت نشده'); window.open(g.url, '_blank', 'noopener'); return; }
  if (g.type === 'download') {
    if (g.file_path) { const { data, error } = await sb.storage.from(B).createSignedUrl(g.file_path, 300, { download: true }); if (error) throw error; location.href = data.signedUrl; }
    else if (g.url) window.open(g.url, '_blank', 'noopener'); else throw new Error('فایلی ثبت نشده');
    return;
  }
  if (!g.file_path) throw new Error('فایل بازی ثبت نشده');
  const { data, error } = await sb.storage.from(B).createSignedUrl(g.file_path, 300); if (error) throw error;
  const r = await fetch(data.signedUrl); if (!r.ok) throw new Error('دریافت بازی ناموفق بود');
  $('#frame').srcdoc = await r.text(); $('#modal').hidden = false;
}

async function saveGame(f) {
  const d = new FormData(f), id = d.get('id'), old = games.find(g => g.id === id);
  const img = f.image.files[0], file = f.file.files[0], type = d.get('type');
  if (file && type === 'html' && !/\.html?$/i.test(file.name)) throw new Error('برای بازی HTML فقط فایل .html مجاز است');
  if (type === 'html' && !file && !old?.file_path) throw new Error('فایل HTML را انتخاب کنید');
  if (type === 'external' && !d.get('url')) throw new Error('لینک بازی را وارد کنید');
  if (type === 'download' && !file && !d.get('url') && !old?.file_path) throw new Error('فایل یا لینک دانلود لازم است');
  const up = async (fl, k) => {
    if (fl.size > MAX) throw new Error('حجم فایل بیش از ۵۰ مگابایت است');
    const p = `${k}/${crypto.randomUUID()}-${fl.name.replace(/[^\w.\-]/g, '_')}`;
    const { error } = await sb.storage.from(B).upload(p, fl, { contentType: fl.type || undefined }); if (error) throw error; return p;
  };
  const rec = { title: d.get('title').trim(), description: d.get('description'), category_id: d.get('category_id') || null, type, url: d.get('url') || null, status: d.get('status'), featured: f.featured.checked };
  const ip = img ? await up(img, 'images') : null, fp = file ? await up(file, 'files') : null;
  if (ip) rec.image_path = ip; if (fp) rec.file_path = fp;
  const q = id ? sb.from('games').update(rec).eq('id', id) : sb.from('games').insert(rec);
  const { data, error } = await q.select().single(); if (error) throw error;
  const rows = [];
  if (ip) rows.push({ game_id: data.id, path: ip, kind: 'image' });
  if (fp) rows.push({ game_id: data.id, path: fp, kind: /\.zip$/i.test(fp) ? 'zip' : 'html' });
  if (rows.length) { const r = await sb.from('game_files').insert(rows); if (r.error) throw r.error; }
  toast('ذخیره شد ✔'); await refresh();
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const { act, id } = t.dataset;
  try {
    if (act === 'play') await play(id);
    else if (act === 'cat') { catF = id; render(); }
    else if (act === 'logout') { await sb.auth.signOut(); toast('خارج شدید'); }
    else if (act === 'register') {
      const f = $('#authForm'); if (!f.reportValidity()) return;
      const { data, error } = await sb.auth.signUp({ email: f.email.value, password: f.password.value }); if (error) throw error;
      toast(data.session ? 'ثبت‌نام انجام شد' : 'ایمیل تأیید برایتان ارسال شد');
    }
    else if (act === 'delcat') { if (!confirm('حذف دسته؟')) return; const { error } = await sb.from('categories').delete().eq('id', id); if (error) throw error; toast('حذف شد'); await refresh(); }
    else if (act === 'edit') {
      const g = games.find(x => x.id === id), f = $('#gameForm'); if (!g) return;
      f.id.value = g.id; f.title.value = g.title; f.description.value = g.description || ''; f.category_id.value = g.category_id || '';
      f.type.value = g.type; f.url.value = g.url || ''; f.status.value = g.status; f.featured.checked = !!g.featured;
      $('#gt').textContent = 'ویرایش بازی'; f.scrollIntoView({ behavior: 'smooth' });
    }
    else if (act === 'reset') { $('#gameForm').reset(); $('#gameForm').id.value = ''; $('#gt').textContent = 'افزودن بازی'; }
    else if (act === 'delgame') {
      if (!confirm('این بازی و فایل‌هایش حذف شود؟')) return;
      const { data: fs } = await sb.from('game_files').select('path').eq('game_id', id);
      const paths = (fs || []).map(x => x.path); if (paths.length) await sb.storage.from(B).remove(paths);
      const { error } = await sb.from('games').delete().eq('id', id); if (error) throw error; toast('حذف شد'); await refresh();
    }
  } catch (err) { toast(err.message || 'خطای ناشناخته', 1); }
});

document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  try {
    if (f.id === 'authForm' || f.matches('#authForm')) {
      const { error } = await sb.auth.signInWithPassword({ email: f.email.value, password: f.password.value }); if (error) throw error; toast('وارد شدید ✔');
    } else if (f.matches('#catForm')) {
      const { error } = await sb.from('categories').insert({ name: f.name.value.trim() }); if (error) throw error; toast('دسته افزوده شد'); await refresh();
    } else if (f.matches('#gameForm')) {
      const b = $('#saveBtn'); b.disabled = true; b.textContent = 'در حال ذخیره…';
      try { await saveGame(f); } finally { b.disabled = false; b.textContent = 'ذخیره'; }
    }
  } catch (err) { toast(err.message || 'خطا', 1); }
});
document.addEventListener('input', e => { if (e.target.matches('[data-search]')) { term = e.target.value.trim().toLowerCase(); $('#q').value = e.target.value; location.hash = '#games'; } });

sb.auth.onAuthStateChange(() => { setTimeout(async () => { await loadUser(); await refresh(); }, 0); });
(async () => { await loadUser(); await refresh(); })();

(function(){var s=document.getElementById('start'),d=false;
function go(){if(d)return;d=true;s.classList.add('hide');try{sessionStorage.setItem('nshStart','1')}catch(e){}}
try{if(sessionStorage.getItem('nshStart'))go()}catch(e){}
s.addEventListener('click',go);setTimeout(go,2300);})();
</script>
