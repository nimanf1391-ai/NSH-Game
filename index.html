
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSH.Game | NSH.made</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
 --green:#6557df;--dark:#40369f;--mint:#f0efff;--gold:#21b8b1;
 --bg:#f7f8fd;--text:#25243b;--border:#e8e9f2;
 --blue:#438cf5;--shadow:0 8px 26px rgba(44,42,95,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;transition:transform .18s,filter .18s}
button:hover{filter:brightness(.97);transform:translateY(-1px)}
header{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #24204408}
.brand{font-size:23px;font-weight:bold;color:var(--dark)}
.brand span{color:var(--gold)}
button{border:0;border-radius:11px;padding:10px 15px}
.primary{background:linear-gradient(120deg,var(--green),var(--blue));color:#fff}
.secondary{background:var(--mint);color:var(--dark)}
.danger{background:#fff0f2;color:#c83d58}
.menu{background:var(--mint);color:var(--dark);font-size:22px}
.layout{display:flex;min-height:calc(100vh - 68px)}
.sidebar{width:255px;background:#fff;border-left:1px solid var(--border);padding:20px;position:fixed;right:0;top:68px;bottom:0;z-index:30;transform:translateX(105%);transition:.25s;overflow:auto}
.sidebar.open{transform:translateX(0)}
.sidebar button{display:block;width:100%;text-align:right;margin:5px 0;background:transparent;color:var(--text);padding:12px}
.sidebar button:hover{background:var(--mint);color:var(--dark)}
.shade{display:none;position:fixed;inset:68px 0 0;background:#17152c77;z-index:25}
.shade.show{display:block}
main{width:100%;padding:25px;max-width:1200px;margin:auto}
.hero{background:linear-gradient(120deg,#efedff,#e9f5ff 65%,#e5fbf8);border:1px solid #e5e4f7;border-radius:22px;padding:30px;margin-bottom:25px;box-shadow:var(--shadow)}
.hero h1{font-size:32px;color:var(--dark)}
.hero p{color:#70718b;line-height:2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card,.panel{background:#fff;border:1px solid var(--border);border-radius:17px;padding:16px;box-shadow:var(--shadow)}
.card{transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #29245b13}
.thumb{height:130px;background:linear-gradient(135deg,#efedff,#e7f7ff);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:45px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.card h3{margin-bottom:5px}
.card p{color:#777990;font-size:13px;line-height:1.8}
.page{display:none}.page.active{display:block}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;margin:5px 0 13px;background:#fff;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px #6557df18}
input[type=file]{background:#fafaff;padding:9px}
input[type=checkbox]{width:auto;accent-color:var(--green)}
textarea{min-height:90px}
label{font-size:13px;color:#777990}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.notice{padding:12px;background:var(--mint);color:var(--dark);border-radius:10px;margin:12px 0;line-height:1.8}
.type-hint{font-size:12px;color:#686b85;background:linear-gradient(110deg,#f1efff,#e9faff);border:1px solid #e7e5fa;border-radius:11px;padding:10px 12px;margin:-5px 0 12px;line-height:1.9}
.creator-chip{display:inline-flex;background:#eafaf7;color:#168777;border-radius:20px;padding:5px 9px;font-size:11px;margin-top:7px}
.file-name{font-size:12px;color:#159b75;min-height:18px;margin-top:-8px}
.admin-game{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:12px 2px}
.admin-game:last-child{border-bottom:0}
.tag{font-size:11px;background:#f0efff;color:var(--dark);padding:5px 9px;border-radius:20px}
.modal{display:none;position:fixed;inset:0;background:#17152ccc;z-index:60;align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}
.modal-box{width:min(100%,1000px);height:min(90vh,700px);background:#fff;border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.modal-body{flex:1;min-height:0}
.modal-body iframe{width:100%;height:100%;border:0}
.toast{position:fixed;bottom:15px;left:15px;z-index:100;background:#302b62;color:#fff;padding:13px 18px;border-radius:12px;display:none;max-width:90%;box-shadow:var(--shadow)}
footer{text-align:center;color:#777990;padding:30px}
.empty{padding:20px;color:#777990;text-align:center}
@media(min-width:900px){.sidebar{transform:none;position:sticky;height:calc(100vh - 68px);top:68px;flex-shrink:0}.menu{display:none}.shade{display:none!important}}
@media(max-width:600px){main{padding:15px}.hero{padding:22px}.hero h1{font-size:24px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.admin-game{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<header>
 <button class="menu" id="menuToggle">☰</button>
 <div class="brand">NSH<span>.</span>Game</div>
 <button class="secondary" data-page="account">حساب کاربری</button>
</header>

<div class="shade" id="shade"></div>

<div class="layout">
<aside class="sidebar" id="sidebar">
 <div class="brand">NSH<span>.</span>made</div>
 <hr>
 <button data-page="home">🏠 خانه</button>
 <button data-page="games">🎮 همه بازی‌ها</button>
 <button data-page="categories">🗂 دسته‌بندی‌ها</button>
 <button data-page="account">👤 حساب کاربری</button>
 <button data-page="admin">⚙️ مدیریت سایت</button>
 <button data-page="about">ℹ️ درباره ما</button>
</aside>

<main>

<section class="page active" id="home">
 <div class="hero">
  <h1>به NSH.Game خوش آمدی 🎮</h1>
  <p>بازی‌ها و ابزارهای دیجیتال در یک مکان.</p>
  <button class="primary" data-page="games">مشاهده بازی‌ها</button>
 </div>
 <h2>بازی‌های منتخب</h2>
 <div class="grid" id="featured"></div>
</section>

<section class="page" id="games">
 <h2>همه بازی‌ها</h2>
 <input id="search" placeholder="جست‌وجوی بازی...">
 <div class="grid" id="gameList"></div>
</section>

<section class="page" id="categories">
 <h2>دسته‌بندی‌ها</h2>
 <div class="grid" id="categoryList"></div>
</section>

<section class="page" id="account">
 <div class="panel" id="accountPanel"></div>
</section>

<section class="page" id="admin">
 <h2>پنل مدیریت</h2>
 <div id="adminPanel"></div>
</section>

<section class="page" id="about">
 <div class="panel">
  <h2>درباره NSH.Game</h2>
  <p>ساخته‌شده با NSH.made</p>
 </div>
</section>

<footer>© NSH.Game | NSH.made</footer>
</main>
</div>

<div class="modal" id="gameModal">
 <div class="modal-box">
  <div class="modal-head">
   <b id="modalTitle">بازی</b>
   <button id="closeGame">✕</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
 </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* تنظیمات Supabase */
const SUPABASE_URL="https://knuludqjykyijqfaolwu.supabase.co";
const SUPABASE_KEY="sb_publishable_55TKXT3Eu20nq6SUzaDfOg_0R93DhLV";
const BUCKET="nsh-game-files";

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

let db=null;
let user=null;
let profile=null;
let gameSaveInProgress=false;
let deferredSignOutEvent=false;
let games=[];
let categories=[];
let selectedCategory=null;

function notify(message){
 const t=$("#toast");
 t.textContent=message;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.style.display="none",3500);
}

function safe(value=""){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function closeMenu(){
 $("#sidebar").classList.remove("open");
 $("#shade").classList.remove("show");
 $("#menuToggle").setAttribute("aria-expanded","false");
}

function showPage(name){
 $$(".page").forEach(p=>p.classList.remove("active"));
 const page=$("#"+name);
 if(page)page.classList.add("active");
 closeMenu();
 if(name==="admin")renderAdmin();
 if(name==="account")renderAccount();
 if(name==="games")renderGames();
 if(name==="categories")renderCategories();
 window.scrollTo(0,0);
}

$("#menuToggle").addEventListener("click",()=>{
 const open=!$("#sidebar").classList.contains("open");
 $("#sidebar").classList.toggle("open",open);
 $("#shade").classList.toggle("show",open);
 $("#menuToggle").setAttribute("aria-expanded",String(open));
});
$("#shade").addEventListener("click",closeMenu);
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  closeMenu();
  closeGame();
 }
});

function categoryName(id){
 return categories.find(c=>String(c.id)===String(id))?.name||"بدون دسته‌بندی";
}

function card(game){
 const image=game._thumbnailUrl||(
  game.thumbnail_url&&/^https?:\/\//i.test(game.thumbnail_url)?game.thumbnail_url:""
 );
 return `
 <article class="card">
  <div class="thumb">
   ${image?`<img src="${safe(image)}" alt="${safe(game.title)}">`:"🎮"}
  </div>
  <h3>${safe(game.title)}</h3>
  <p>${safe(game.description||"بدون توضیحات")}</p>
  <small>${safe(categoryName(game.category_id))}</small>
  ${game.developer?`<div class="creator-chip">✍️ سازنده: ${safe(game.developer)}</div>`:""}
  <div class="row" style="margin-top:12px">
   <button class="primary" data-action="play" data-id="${safe(game.id)}">اجرای بازی</button>
   ${isAdmin()?`<button class="secondary" data-action="edit" data-id="${safe(game.id)}">ویرایش</button>`:""}
  </div>
 </article>`;
}

function renderGames(){
 const q=($("#search").value||"").trim().toLowerCase();
 const list=games.filter(g=>
  (!selectedCategory||String(g.category_id)===String(selectedCategory))&&
  `${g.title} ${g.description||""}`.toLowerCase().includes(q)
 );
 $("#gameList").innerHTML=list.map(card).join("")||"<p class='empty'>بازی‌ای پیدا نشد.</p>";
}

function renderHome(){
 const featured=games.filter(g=>g.featured);
 $("#featured").innerHTML=(featured.length?featured:games.slice(0,4))
  .map(card).join("")||"<p class='empty'>هنوز بازی‌ای منتشر نشده است.</p>";
}

function renderCategories(){
 $("#categoryList").innerHTML=categories.map(c=>`
  <button class="card" data-action="category" data-id="${safe(c.id)}">
   🗂️ ${safe(c.name)}
  </button>
 `).join("")||"<p class='empty'>دسته‌بندی موجود نیست.</p>";
}

async function temporaryUrl(path){
 if(!path)return null;
 if(/^https?:\/\//i.test(path))return path;
 const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,3600);
 if(error)throw error;
 return data.signedUrl;
}

async function loadData(){
 const categoryRequest=db.from("categories").select("*").order("name");
 let gameRequest=db.from("games").select("*").order("created_at",{ascending:false});
 if(!isAdmin())gameRequest=gameRequest.eq("status","published");
 const [c,g]=await Promise.all([categoryRequest,gameRequest]);
 if(c.error)throw c.error;
 if(g.error)throw g.error;
 categories=c.data||[];
 games=g.data||[];

 // لینک‌های امضاشده فقط برای نمایش ساخته می‌شوند؛ مسیر دائمی دیتابیس دست‌نخورده می‌ماند.
 await Promise.all(games.map(async game=>{
  game._thumbnailUrl=null;
  if(game.thumbnail_url){
   try{game._thumbnailUrl=await temporaryUrl(game.thumbnail_url);}
   catch(error){console.warn("خطای تصویر بازی:",error.message);}
  }
 }));
 renderHome();renderGames();renderCategories();
 if($("#adminGames"))renderAdminGames();
}

async function refreshUser(){
 const {data,error}=await db.auth.getUser();
 if(error)throw error;
 user=data.user;
 profile=null;
 if(user){
  const result=await db.from("profiles").select("*")
   .eq("id",user.id).maybeSingle();
  if(!result.error)profile=result.data;
 }
}

function isAdmin(){
 return profile?.role==="admin";
}

function renderAccount(){
 if(!user){
  $("#accountPanel").innerHTML=`
   <h2>ورود / ثبت‌نام</h2>
   <form id="authForm">
    <label>ایمیل</label>
    <input name="email" type="email" required>
    <label>رمز عبور</label>
    <input name="password" type="password" minlength="6" required>
    <div class="row">
     <button class="primary" type="submit">ورود</button>
     <button class="secondary" type="button" id="signup">ثبت‌نام</button>
    </div>
   </form>`;
 }else{
  $("#accountPanel").innerHTML=`
   <h2>حساب کاربری</h2>
   <p>${safe(user.email)}</p>
   <p>${isAdmin()?"مدیر":"کاربر عادی"}</p>
   <button class="danger" data-action="logout">خروج</button>`;
 }
}

async function uploadFile(file,folder){
 if(!file)return null;
 if(file.size>50*1024*1024)throw Error("حداکثر حجم فایل ۵۰ مگابایت است.");
 const name=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const path=folder+"/"+user.id+"/"+Date.now()+"-"+name;
 const {error}=await db.storage.from(BUCKET).upload(path,file,{upsert:false});
 if(error)throw error;
 return path;
}

function renderAdmin(){
 if(!user||!isAdmin()){
  $("#adminPanel").innerHTML='<div class="panel">برای مدیریت باید با حساب مدیر وارد شوی.</div>';
  return;
 }

 // اگر فرم قبلاً ساخته شده، آن را دوباره با innerHTML جایگزین نکن؛
 // بازسازی DOM باعث پاک شدن فایل انتخاب‌شده در input[type=file] می‌شود.
 if($("#gameForm") && $("#adminGames")){
  renderAdminGames();
  return;
 }

 $("#adminPanel").innerHTML=`
 <div class="panel">
  <h3>افزودن / ویرایش بازی</h3>
  <div class="notice">فایل HTML یا ZIP را انتخاب کن. فایل در فضای ذخیره‌سازی خصوصی سایت قرار می‌گیرد.</div>
  <form id="gameForm">
   <input type="hidden" name="id">
   <div class="form-grid">
    <div><label>عنوان بازی</label><input name="title" required placeholder="نام بازی"></div>
    <div><label>سازنده بازی</label><input name="developer" placeholder="نام سازنده یا استودیو"></div>
    <div><label>دسته‌بندی</label>
     <select name="category_id">
      <option value="">بدون دسته‌بندی</option>
      ${categories.map(c=>`<option value="${safe(c.id)}">${safe(c.name)}</option>`).join("")}
     </select>
    </div>
    <div><label>نوع بازی</label>
     <select name="game_type" id="gameType" required>
      <option value="browser" selected>🎮 بازی تحت وب (HTML)</option>
      <option value="external">🌐 بازی با لینک خارجی</option>
      <option value="download">📦 فایل دانلودی (ZIP)</option>
     </select>
     <div class="type-hint" id="gameTypeHint">فایل HTML یا HTM انتخاب کن تا بازی داخل سایت اجرا شود.</div>
    </div>
    <div class="full"><label>توضیحات</label><textarea name="description" placeholder="درباره بازی بنویس..."></textarea></div>
    <div><label>وضعیت انتشار</label>
     <select name="status">
      <option value="published" selected>✅ منتشرشده</option>
      <option value="draft">📝 پیش‌نویس</option>
      <option value="archived">📁 بایگانی</option>
     </select>
    </div>
    <div><label>آدرس بازی خارجی (برای نوع لینک خارجی)</label><input name="game_url" type="url" placeholder="https://example.com"></div>
    <div>
     <label>تصویر بازی</label>
     <input name="thumbnail" type="file" accept="image/*">
     <div class="file-name" id="thumbnailName"></div>
    </div>
    <div>
     <label>فایل بازی (HTML یا ZIP)</label>
     <input name="gamefile" type="file" accept=".html,.htm,.zip,text/html,application/zip">
     <div class="file-name" id="gamefileName"></div>
    </div>
    <div class="full"><label><input type="checkbox" name="featured" style="width:auto"> ⭐ نمایش در بازی‌های منتخب</label></div>
   </div>
   <button class="primary" id="saveGameButton" type="submit">ذخیره بازی</button>
   <button class="secondary" type="reset">پاک کردن فرم</button>
  </form>
 </div>
 <div class="panel" style="margin-top:16px">
  <h3>بازی‌های ثبت‌شده</h3>
  <div id="adminGames"></div>
 </div>`;
 const form=$("#gameForm");
 form.elements.thumbnail.addEventListener("change",e=>{
  $("#thumbnailName").textContent=e.target.files[0]?"انتخاب شد: "+e.target.files[0].name:"";
 });
 form.elements.gamefile.addEventListener("change",e=>{
  $("#gamefileName").textContent=e.target.files[0]?"انتخاب شد: "+e.target.files[0].name:"";
 });
 const updateGameTypeHelp=()=>{
  const type=form.elements.game_type.value;
  const hint=$("#gameTypeHint");
  const fileInput=form.elements.gamefile;
  const urlInput=form.elements.game_url;
  if(type==="browser"){
   hint.textContent="🎮 فایل HTML یا HTM انتخاب کن؛ بازی داخل سایت اجرا می‌شود.";
   fileInput.accept=".html,.htm,text/html";urlInput.required=false;
  }else if(type==="external"){
   hint.textContent="🌐 آدرس کامل بازی را وارد کن؛ مثل https://example.com. فایل لازم نیست.";
   fileInput.accept=".html,.htm,.zip,text/html,application/zip";urlInput.required=true;
  }else{
   hint.textContent="📦 فایل ZIP انتخاب کن تا بازدیدکننده بتواند آن را دانلود کند.";
   fileInput.accept=".zip,application/zip";urlInput.required=false;
  }
 };
 form.elements.game_type.addEventListener("change",updateGameTypeHelp);
 updateGameTypeHelp();
 form.addEventListener("reset",()=>setTimeout(()=>{
  $("#thumbnailName").textContent="";
  $("#gamefileName").textContent="";
  updateGameTypeHelp();
 },0));
 renderAdminGames();
}

function renderAdminGames(){
 const el=$("#adminGames");
 if(!el)return;
 el.innerHTML=games.map(g=>`
  <div class="admin-game">
   <div><strong>${safe(g.title)}</strong> <span class="tag">${safe(g.status)}</span></div>
   <div class="row">
    <button class="secondary" data-action="edit" data-id="${safe(g.id)}">ویرایش</button>
    <button class="danger" data-action="delete" data-id="${safe(g.id)}">حذف</button>
   </div>
  </div>
 `).join("")||"<p class='empty'>بازی ثبت نشده است.</p>";
}

async function saveGame(form){
 const button=$("#saveGameButton");
 const fd=new FormData(form);
 const id=String(fd.get("id")||"");
 const oldGame=id?games.find(g=>String(g.id)===id):null;
 const sessionResult=await db.auth.getSession();
 if(sessionResult.error)throw sessionResult.error;
 if(!sessionResult.data.session?.user)throw Error("نشست ورود منقضی شده است؛ دوباره وارد حساب مدیر شو.");
 if(!isAdmin())throw Error("حساب فعلی دسترسی مدیر ندارد.");

 const type=String(fd.get("game_type")||"");
 if(!["browser","external","download"].includes(type))throw Error("نوع بازی را انتخاب کن.");
 const gameFile=fd.get("gamefile");
 const thumb=fd.get("thumbnail");
 const externalUrl=String(fd.get("game_url")||"").trim();
 if(type==="external"&&!externalUrl)throw Error("برای بازی خارجی، آدرس بازی را وارد کن.");
 if(type==="browser"&&!gameFile?.size&&!oldGame?.game_url)throw Error("برای بازی تحت وب، فایل HTML را انتخاب کن.");
 if(type==="download"&&!gameFile?.size&&!oldGame?.game_url)throw Error("برای بازی دانلودی، فایل ZIP را انتخاب کن.");
 if(gameFile?.size){
  const isHtml=/\.html?$/i.test(gameFile.name),isZip=/\.zip$/i.test(gameFile.name);
  if(type==="browser"&&!isHtml)throw Error("برای بازی تحت وب فقط فایل HTML یا HTM انتخاب کن.");
  if(type==="download"&&!isZip)throw Error("برای بازی دانلودی فقط فایل ZIP انتخاب کن.");
  if(type==="external")throw Error("برای نوع لینک خارجی فایل انتخاب نکن؛ آدرس بازی را وارد کن.");
 }
 const payload={
  title:String(fd.get("title")||"").trim(),
  developer:String(fd.get("developer")||"").trim()||null,
  description:String(fd.get("description")||"").trim(),
  category_id:fd.get("category_id")||null,
  game_type:type,
  status:String(fd.get("status")||"published"),
  featured:fd.get("featured")==="on",
  updated_at:new Date().toISOString()
 };
 if(!payload.title)throw Error("عنوان بازی الزامی است.");
 if(type==="external")payload.game_url=externalUrl;
 else if(gameFile?.size)payload.game_url=null;
 else payload.game_url=oldGame?.game_url||null;

 button.disabled=true;button.textContent="در حال ذخیره...";
 gameSaveInProgress=true;
 try{
  if(thumb?.size){
   if(!thumb.type.startsWith("image/"))throw Error("فایل تصویر معتبر نیست.");
   payload.thumbnail_url=await uploadFile(thumb,"thumbnails");
  }else if(oldGame){payload.thumbnail_url=oldGame.thumbnail_url;}
  if(gameFile?.size)payload.game_url=await uploadFile(gameFile,"games");

  const sessionCheck=await db.auth.getSession();
  if(sessionCheck.error)throw sessionCheck.error;
  if(!sessionCheck.data.session?.user)throw Error("نشست هنگام آپلود منقضی شد. دوباره وارد شو؛ این خطا به‌معنی حذف حساب نیست.");

  let result;
  if(id)result=await db.from("games").update(payload).eq("id",id);
  else{
   payload.created_at=new Date().toISOString();
   result=await db.from("games").insert(payload);
  }
  if(result.error)throw result.error;

  form.reset();
  form.elements.namedItem("id").value="";
  $("#thumbnailName").textContent="";$("#gamefileName").textContent="";
  try{
   await loadData();
   renderAdminGames();
   notify("بازی با موفقیت ذخیره و منتشر شد. ✅");
  }catch(refreshError){
   console.error("Data refresh after save failed:",refreshError);
   notify("بازی ذخیره شد؛ اما تازه‌سازی فهرست خطا داد: "+refreshError.message);
  }
 }finally{
  gameSaveInProgress=false;
  button.disabled=false;button.textContent="ذخیره بازی";
  if(deferredSignOutEvent){
   deferredSignOutEvent=false;
   try{
    const check=await db.auth.getSession();
    if(check.data.session?.user){
     user=check.data.session.user;
     const pr=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
     profile=pr.error?null:pr.data;
     renderAccount();renderAdmin();
    }else{
     user=null;profile=null;renderAccount();renderAdmin();
     notify("نشست ورود واقعاً پایان یافته است؛ دوباره وارد حساب مدیر شو.");
    }
   }catch(authCheckError){console.error("Deferred auth check failed:",authCheckError);}
  }
 }
}
async function editGame(id){
 const game=games.find(g=>String(g.id)===String(id));
 if(!game)throw Error("بازی پیدا نشد.");
 const form=$("#gameForm");
 if(!form)throw Error("فرم مدیریت پیدا نشد.");

 const set=(name,value)=>{
  const field=form.elements.namedItem(name);
  if(field)field.value=value??"";
 };
 set("id",game.id);
 set("title",game.title);
 set("developer",game.developer);
 set("description",game.description);
 set("category_id",game.category_id);
 set("game_type",game.game_type);
 set("status",game.status);
 set("game_url",game.game_url&&/^https?:\/\//i.test(game.game_url)?game.game_url:"");
 const featured=form.elements.namedItem("featured");
 if(featured)featured.checked=!!game.featured;
 form.elements.game_type.dispatchEvent(new Event("change"));
 form.scrollIntoView({behavior:"smooth"});
}

async function deleteGame(id){
 if(!isAdmin())throw Error("دسترسی مدیر لازم است.");
 if(!confirm("این بازی حذف شود؟"))return;
 const {error}=await db.from("games").delete().eq("id",id);
 if(error)throw error;
 await loadData();
 renderAdmin();
 notify("بازی حذف شد.");
}

async function playGame(id){
 const game=games.find(g=>String(g.id)===String(id));
 if(!game)throw Error("بازی پیدا نشد.");
 $("#modalTitle").textContent=game.title;
 $("#modalBody").innerHTML="<p style='padding:25px'>در حال بارگذاری بازی...</p>";
 $("#gameModal").classList.add("show");
 let url=game.game_url;
 if(url&&!/^https?:\/\//i.test(url))url=await temporaryUrl(url);

 if(!url){
  $("#modalBody").innerHTML="<p style='padding:25px'>آدرس بازی ثبت نشده است.</p>";
 }else if(game.game_type==="download"){
  $("#modalBody").innerHTML=`<div style="padding:30px"><a class="primary" href="${safe(url)}" target="_blank" rel="noopener">دانلود بازی</a></div>`;
 }else if(game.game_type==="external"){
  $("#modalBody").innerHTML=`<div style="padding:30px"><a class="primary" href="${safe(url)}" target="_blank" rel="noopener">باز کردن بازی</a></div>`;
 }else{
  $("#modalBody").innerHTML=`<iframe src="${safe(url)}" title="${safe(game.title)}" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups"></iframe>`;
 }
}

function closeGame(){
 $("#gameModal").classList.remove("show");
 $("#modalBody").innerHTML="";
}
$("#closeGame").addEventListener("click",closeGame);
$("#gameModal").addEventListener("click",e=>{
 if(e.target.id==="gameModal")closeGame();
});

document.addEventListener("click",async e=>{
 const page=e.target.closest("[data-page]");
 if(page){showPage(page.dataset.page);return;}

 const button=e.target.closest("[data-action]");
 if(!button)return;

 try{
  const action=button.dataset.action;
  const id=button.dataset.id;

  if(action==="play")await playGame(id);
  if(action==="edit")await editGame(id);
  if(action==="delete")await deleteGame(id);
  if(action==="logout"){
   const {error}=await db.auth.signOut();
   if(error)throw error;
   await refreshUser();
   renderAccount();
   renderAdmin();
   notify("خارج شدی.");
  }
  if(action==="category"){
   selectedCategory=id;
   showPage("games");
   renderGames();
  }
 }catch(error){
  console.error(error);
  notify("خطا: "+error.message);
 }
});

function authErrorMessage(error){
 const code=String(error?.code||error?.name||"").toLowerCase();
 const message=String(error?.message||error||"");
 const m=message.toLowerCase();
 if(code.includes("invalid_login")||m.includes("invalid login credentials"))
  return "ایمیل یا رمز عبور اشتباه است. اطلاعات را بررسی کن.";
 if(code.includes("email_not_confirmed")||m.includes("email not confirmed"))
  return "ایمیل حساب هنوز تأیید نشده است. صندوق ایمیلت را بررسی کن.";
 if(m.includes("too many requests"))
  return "تلاش‌های ورود زیاد بوده؛ چند دقیقه صبر کن و دوباره امتحان کن.";
 if(m.includes("fetch")||m.includes("network"))
  return "اتصال به سرور برقرار نشد. اینترنت و آدرس Supabase را بررسی کن.";
 return "خطای ورود: "+message;
}

document.addEventListener("submit",async e=>{
 if(e.target.id==="gameForm"){
  e.preventDefault();
  try{await saveGame(e.target);}
  catch(error){console.error("Game save failed:",error);notify("ذخیره انجام نشد: "+(error.message||"خطای نامشخص"));}
 }
 if(e.target.id==="authForm"){
  e.preventDefault();
  const form=e.target;
  const submitButton=form.querySelector('button[type="submit"]');
  if(submitButton){submitButton.disabled=true;submitButton.textContent="در حال ورود...";}
  try{
   if(!db)throw new Error("اتصال Supabase هنوز آماده نیست. صفحه را تازه‌سازی کن.");
   const fd=new FormData(form);
   const email=String(fd.get("email")||"").trim().toLowerCase();
   const password=String(fd.get("password")||"");
   if(!email||!password)throw new Error("ایمیل و رمز عبور را وارد کن.");
   const {data,error}=await db.auth.signInWithPassword({email,password});
   if(error)throw error;
   user=data.user||null;
   profile=null;
   if(user){
    const profileResult=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
    if(!profileResult.error)profile=profileResult.data;
    else console.warn("Profile lookup failed after successful login:",profileResult.error.message);
   }
   renderAccount();
   renderAdmin();
   notify("ورود موفق بود.");
   try{await loadData();}
   catch(loadError){console.error(loadError);notify("وارد شدی، اما دریافت اطلاعات سایت با خطا روبه‌رو شد: "+loadError.message);}
  }catch(error){
   console.error("Login error:",error);
   notify(authErrorMessage(error));
  }finally{
   if(submitButton){submitButton.disabled=false;submitButton.textContent="ورود";}
  }
 }
});

document.addEventListener("click",async e=>{
 if(e.target.id==="signup"){
  const form=$("#authForm");
  if(!form.reportValidity())return;
  try{
   const fd=new FormData(form);
   const {error}=await db.auth.signUp({
    email:fd.get("email"),
    password:fd.get("password")
   });
   if(error)throw error;
   notify("ثبت‌نام انجام شد؛ ایمیل خود را بررسی کن.");
  }catch(error){notify(error.message);}
 }
});

$("#search").addEventListener("input",renderGames);

async function refreshUser(){
 const {data,error}=await db.auth.getUser();
 if(error)throw error;
 user=data.user;
 profile=null;
 if(user){
  const {data,error}=await db.from("profiles")
   .select("*").eq("id",user.id).maybeSingle();
  if(!error)profile=data;
 }
}

async function startApp(){
 if(!window.supabase?.createClient){
  notify("اتصال Supabase بارگذاری نشد.");
  return;
 }
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
 });
 db.auth.onAuthStateChange((event,session)=>{
  // تمدید توکن نباید فرم آپلود را بازسازی کند.
  if(event==="TOKEN_REFRESHED"||event==="INITIAL_SESSION")return;
  if(event==="SIGNED_OUT"&&gameSaveInProgress){
   // بعضی رویدادهای خروج هنگام عملیات طولانی نباید فرم را ناگهان به صفحه ورود برگردانند.
   deferredSignOutEvent=true;
   console.warn("SIGNED_OUT event deferred while saving game");
   return;
  }
  if(event!=="SIGNED_IN"&&event!=="SIGNED_OUT"&&event!=="USER_UPDATED")return;
  setTimeout(async()=>{
   if(event==="SIGNED_OUT"){
    try{
     const current=await db.auth.getSession();
     if(current.data.session?.user){
      console.warn("Ignoring SIGNED_OUT event: an active session still exists");
      user=current.data.session.user;
      const pr=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
      profile=pr.error?null:pr.data;
      renderAccount();renderAdmin();
      return;
     }
    }catch(checkError){console.error("Session verification failed:",checkError);}
   }
   try{
    user=session?.user||null;
    profile=null;
    if(user){
     const pr=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
     if(!pr.error)profile=pr.data;
     else console.warn("Profile lookup:",pr.error.message);
    }
    renderAccount();
    if(!user)$("#adminPanel").innerHTML='<div class="panel">برای مدیریت باید با حساب مدیر وارد شوی.</div>';
    await loadData();
   }catch(error){console.error(error);notify("خطا در به‌روزرسانی اطلاعات: "+error.message);}
  },0);
 });
 try{
  await refreshUser();
  await loadData();
 }catch(error){
  console.error(error);
  notify("خطا در دریافت اطلاعات: "+error.message);
 }
 renderAccount();
 renderAdmin();
}

startApp();
</script>
